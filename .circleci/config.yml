version: 2.1

commands:
  install-rust:
    steps:
      - run:
          name: Install stable Rust
          command: |
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            fi
            . "$HOME/.cargo/env"
            rustup default stable
            rustup component add rustfmt
            echo '. "$HOME/.cargo/env"' >> "$BASH_ENV"
  rust-checks:
    steps:
      - run: cargo fmt --all -- --check
      - run: cargo test --locked

jobs:
  linux:
    docker:
      - image: cimg/base:stable
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install GUI build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config cmake libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - install-rust
      - restore_cache:
          keys: ["rust-v1-linux-{{ checksum \"Cargo.lock\" }}"]
      - rust-checks
      - run:
          name: Package Linux release
          command: sh packaging/build-linux.sh
          no_output_timeout: 20m
      - save_cache:
          key: "rust-v1-linux-{{ checksum \"Cargo.lock\" }}"
          paths: [~/.cargo/registry, ~/.cargo/git, target]
      - persist_to_workspace:
          root: dist
          paths:
            - "Ferrum-*-linux-x86_64.tar.gz"
      - store_artifacts:
          path: dist
          destination: linux-x86_64

  macos:
    parameters:
      target:
        type: string
    macos:
      xcode: "27.1.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - install-rust
      - restore_cache:
          keys: ["rust-v1-macos-<< parameters.target >>-{{ checksum \"Cargo.lock\" }}"]
      - run: rustup target add << parameters.target >>
      - rust-checks
      - run:
          name: Test macOS packaging
          command: python3 -m unittest discover -s packaging -p 'test_build_macos.py' -v
      - run:
          name: Package macOS release
          command: sh packaging/build-macos-ci.sh << parameters.target >>
          no_output_timeout: 20m
      - save_cache:
          key: "rust-v1-macos-<< parameters.target >>-{{ checksum \"Cargo.lock\" }}"
          paths: [~/.cargo/registry, ~/.cargo/git, target]
      - persist_to_workspace:
          root: dist
          paths:
            - "Ferrum-*-macos-*.dmg"
      - store_artifacts:
          path: dist
          destination: macos-<< parameters.target >>

  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Install stable Rust
          command: |
            $ErrorActionPreference = 'Stop'
            choco install nasm cmake -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\NASM;C:\Program Files\CMake\bin;$env:Path"
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe"
              & "$env:TEMP\rustup-init.exe" -y --profile minimal
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            rustup default stable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            rustup component add rustfmt
            exit $LASTEXITCODE
      - restore_cache:
          keys: ["rust-v1-windows-{{ checksum \"Cargo.lock\" }}"]
      - run:
          name: Format and unit tests
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\NASM;C:\Program Files\CMake\bin;$env:Path"
            cargo fmt --all -- --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked
            exit $LASTEXITCODE
      - run:
          name: Package Windows release
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\NASM;C:\Program Files\CMake\bin;$env:Path"
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\packaging\build-windows.ps1
          no_output_timeout: 20m
      - save_cache:
          key: "rust-v1-windows-{{ checksum \"Cargo.lock\" }}"
          paths: ['C:\Users\circleci\.cargo\registry', 'C:\Users\circleci\.cargo\git', target]
      - persist_to_workspace:
          root: dist
          paths:
            - "Ferrum-*-windows-x86_64.zip"
            - "Ferrum-*-windows-x86_64-setup.exe"
      - store_artifacts:
          path: dist
          destination: windows-x86_64

  publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: release-artifacts
      - run:
          name: Install GitHub CLI
          command: sudo apt-get update && sudo apt-get install -y gh
      - run:
          name: Test release publishing logic
          command: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - run:
          name: Remove macOS workspace metadata
          command: find release-artifacts -type f -name '._*' -delete
      - run:
          name: Publish tagged GitHub release
          command: python3 packaging/publish_release.py release-artifacts
          no_output_timeout: 10m
      - store_artifacts:
          path: release-artifacts/SHA256SUMS.txt
          destination: SHA256SUMS.txt

workflows:
  compile-all-platforms:
    when:
      matches:
        pattern: "^v.*"
        value: << pipeline.git.tag >>
    jobs:
      - linux:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - macos:
          matrix:
            alias: macos-builds
            parameters:
              target: [aarch64-apple-darwin, x86_64-apple-darwin]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - windows:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - publish:
          serial-group: << pipeline.project.slug >>/github-release
          requires:
            - linux
            - windows
            - macos-builds
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
