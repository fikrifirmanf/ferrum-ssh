name: Release

# GitHub Actions is the primary release pipeline. If any job fails on a tag push,
# the last job triggers the CircleCI pipeline for the same tag as a fallback.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test macOS packaging
        run: python3 -m unittest discover -s packaging -p 'test_build_macos.py' -v
      - name: Sign, notarize and package macOS
        run: sh packaging/build-macos-ci.sh ${{ matrix.target }}
        env:
          MACOS_REQUIRE_NOTARIZATION: "1"
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfuse2
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
      - run: packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe

  publish:
    needs: [macos, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Test release publishing logic
        run: python3 -m unittest discover -s packaging -p 'test_publish_release.py' -v
      - name: Publish tagged GitHub release
        run: python3 packaging/publish_release.py release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CIRCLE_TAG: ${{ github.ref_name }}
          CIRCLE_SHA1: ${{ github.sha }}

  circleci-fallback:
    needs: [macos, linux, windows, publish]
    if: ${{ failure() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CircleCI fallback pipeline
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$CIRCLECI_TOKEN" ]; then
            echo "::error::Set the CIRCLECI_TOKEN repository secret to enable the CircleCI fallback."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            "https://circleci.com/api/v2/project/gh/${{ github.repository }}/pipeline" \
            -H "Circle-Token: $CIRCLECI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"$TAG\", \"parameters\": {\"run_fallback\": true}}"
